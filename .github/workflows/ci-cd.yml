
name: Angular - Integracion Continua

on:
  push:
    branches:
      - main
      - develop
      - feature/angular-ci-cd

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  angular-ci:
    name: Pruebas y build de Angular
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: angular-registro-productos

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: angular-registro-productos/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas automaticas
        run: npm run test -- --watch=false

      - name: Compilar Angular
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event_name }}" = "push" ]; then
            npm run build -- --configuration production --base-href /Proyecto-pedidos-tiendatecnologia-grupo05/
          else
            npm run build -- --configuration production
          fi
      - name: Preparar rutas para GitHub Pages
        run: |
          cp dist/registro-productos/browser/index.csr.html dist/registro-productos/browser/index.html
          cp dist/registro-productos/browser/index.csr.html dist/registro-productos/browser/404.html



      - name: Guardar artefacto compilado
        uses: actions/upload-artifact@v4
        with:
          name: angular-build
          path: angular-registro-productos/dist/registro-productos/browser/
          if-no-files-found: error


  deploy:
    name: Publicar Angular en GitHub Pages
    needs: angular-ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar build aprobado
        uses: actions/download-artifact@v4
        with:
          name: angular-build
          path: ./publicacion

      - name: Preparar artefacto para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./publicacion

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
