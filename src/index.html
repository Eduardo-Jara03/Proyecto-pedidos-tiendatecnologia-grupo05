<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión de Pedidos</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 20px;
            text-align: center;
        }

        main {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        h2 {
            margin-bottom: 20px;
        }

        form {
            display: grid;
            gap: 12px;
        }

        input,
        button {
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 15px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #f1f5f9;
        }
    </style>
</head>

<body>

    <header>
        <h1>Sistema de Gestión de Pedidos</h1>
        <p>Administración de clientes y productos</p>
    </header>

    <main>

        <!-- ========================= -->
        <!-- MÓDULO DE CLIENTES -->
        <!-- ========================= -->

        <section class="card">

            <h2>Registrar cliente</h2>

            <form id="clienteForm">

                <input
                    type="text"
                    id="nombre"
                    placeholder="Nombre completo"
                    required
                >

                <input
                    type="text"
                    id="documento"
                    placeholder="Documento"
                    required
                >

                <input
                    type="email"
                    id="correo"
                    placeholder="Correo electrónico"
                    required
                >

                <button type="submit">
                    Registrar cliente
                </button>

            </form>

        </section>

        <section class="card">

            <h2>Lista de clientes</h2>

            <table>

                <thead>
                    <tr>
                        <th>#</th>
                        <th>Nombre</th>
                        <th>Documento</th>
                        <th>Correo</th>
                    </tr>
                </thead>

                <tbody id="clientesTabla">
                </tbody>

            </table>

        </section>


        <!-- ========================= -->
        <!-- MÓDULO DE PRODUCTOS -->
        <!-- ========================= -->

        <section class="card">

            <h2>Registrar producto</h2>

            <form id="productoForm">

                <input
                    type="text"
                    id="codigoProducto"
                    placeholder="Código del producto"
                    required
                >

                <input
                    type="text"
                    id="nombreProducto"
                    placeholder="Nombre del producto"
                    required
                >

                <input
                    type="number"
                    id="precioProducto"
                    placeholder="Precio"
                    min="0"
                    step="0.01"
                    required
                >

                <button type="submit">
                    Registrar producto
                </button>

            </form>

        </section>

        <section class="card">

            <h2>Lista de productos</h2>

            <table>

                <thead>
                    <tr>
                        <th>#</th>
                        <th>Código</th>
                        <th>Producto</th>
                        <th>Precio</th>
                    </tr>
                </thead>

                <tbody id="productosTabla">
                </tbody>

            </table>

        </section>

    </main>


    <script>

        // =========================
        // MÓDULO DE CLIENTES
        // =========================

        const clientes = [];

        const formularioCliente =
            document.getElementById("clienteForm");

        const tablaClientes =
            document.getElementById("clientesTabla");

        formularioCliente.addEventListener("submit", function(event) {

            event.preventDefault();

            const nombre =
                document.getElementById("nombre").value;

            const documento =
                document.getElementById("documento").value;

            const correo =
                document.getElementById("correo").value;

            const cliente = {
                nombre: nombre,
                documento: documento,
                correo: correo
            };

            clientes.push(cliente);

            mostrarClientes();

            formularioCliente.reset();

        });


        function mostrarClientes() {

            tablaClientes.innerHTML = "";

            clientes.forEach(function(cliente, index) {

                const fila =
                    document.createElement("tr");

                fila.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${cliente.nombre}</td>
                    <td>${cliente.documento}</td>
                    <td>${cliente.correo}</td>
                `;

                tablaClientes.appendChild(fila);

            });

        }


        // =========================
        // MÓDULO DE PRODUCTOS
        // =========================

        const productos = [];

        const formularioProducto =
            document.getElementById("productoForm");

        const tablaProductos =
            document.getElementById("productosTabla");


        formularioProducto.addEventListener("submit", function(event) {

            event.preventDefault();

            const codigo =
                document.getElementById("codigoProducto").value;

            const nombre =
                document.getElementById("nombreProducto").value;

            const precio =
                document.getElementById("precioProducto").value;

            const producto = {
                codigo: codigo,
                nombre: nombre,
                precio: parseFloat(precio)
            };

            productos.push(producto);

            mostrarProductos();

            formularioProducto.reset();

        });


        function mostrarProductos() {

            tablaProductos.innerHTML = "";

            productos.forEach(function(producto, index) {

                const fila =
                    document.createElement("tr");

                fila.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${producto.codigo}</td>
                    <td>${producto.nombre}</td>
                    <td>S/ ${producto.precio.toFixed(2)}</td>
                `;

                tablaProductos.appendChild(fila);

            });

        }

    </script>

</body>
</html>
